async function openMatchModal(layers, cfg, warnings) {
  matchLayers = layers || [];
  openOverlay("matchOverlay");
  $("matchTplName").textContent = cfg.title || "";
  const wbox = $("matchWarn");
  wbox.innerHTML = warnings && warnings.length
    ? warnings.map(w => '<div class="warnbox">' + esc(w) + "</div>").join("")
    : "";
  if (matchLayers.length) {
    wbox.insertAdjacentHTML("beforeend",
      '<div class="layerinfo">检测到 ' + matchLayers.length + ' 个文字图层：' +
      matchLayers.map(L => esc(L.layerName) + "「" + esc(L.text.slice(0, 10)) + "」").join("、") + "</div>");
  }
  wbox.insertAdjacentHTML("beforeend",
    '<div class="layerinfo">💡 句子里要带名字（如「尊敬的___创作人：」）？把「文字」改成模板并用 {姓名} 占位：<b>尊敬的新片场创作人{姓名}：</b>——渲染时自动填入姓名字段的值；点选字段也能引用，如 {女士/先生}</div>');
  // 字体下拉
  let fonts = [];
  try { fonts = await (await fetch("/api/fonts", { cache: "no-store" })).json(); } catch (e) { }
  const fsel = $("matchFont");
  fsel.innerHTML = fonts.length
    ? fonts.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join("")
    : '<option value="">（还没有字体文件，请上传）</option>';
  if (cfg.fonts && cfg.fonts[0]) fsel.value = cfg.fonts[0].file;
  buildMatchRows(cfg);
}

function buildMatchRows(cfg) {
  const box = $("matchRows");
  box.innerHTML = "";
  cfg.fields.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "match-row";
    if (f.type === "choice") {
      row.style.gridTemplateColumns = "110px 1fr 52px 28px";
      row.innerHTML =
        `<input data-k="label" value="${esc(f.label || "")}" title="表单标签">` +
        `<div style="font-size:12px">` +
        (f.options || []).map(o => '<span class="tag">' + esc(o.text) + "</span>").join(" ") +
        '<div class="layerinfo">自动分组：' +
        (f.options || []).map(o => o.layerName ? "图层「" + esc(o.layerName) + "」" : "「" + esc(o.text) + "」(样式自动补)").join("、") +
        "；页面上点选切换</div></div>" +
        '<label data-k="variable" style="font-size:11px;display:flex;gap:3px;align-items:center"><input type="checkbox" data-k="variable" ' + (f.variable ? "checked" : "") + ' style="width:auto">可变</label>' +
        '<button class="danger" data-k="del" title="删除字段">✕</button>';
      row.querySelector('[data-k="label"]').addEventListener("input", e => { f.label = e.target.value; });
      row.querySelector('[data-k="variable"]').addEventListener("change", e => { f.variable = e.target.checked; });
      row.querySelector('[data-k="del"]').addEventListener("click", () => {
        cfg.fields.splice(i, 1); buildMatchRows(cfg);
      });
      box.appendChild(row);
      return;
    }
    row.innerHTML =
      `<input data-k="label" value="${esc(f.label || "")}" title="表单标签">` +
      `<input data-k="text" value="${esc(f.text || "")}" title="默认文字"${f.type === "fill" ? ' placeholder="留空=纯下划线；填 {姓名} 跟随姓名字段"' : ""}>` +
      `<select data-k="layer"><option value="-1">— 未绑定 —</option>` +
      matchLayers.map((L, li) => {
        const sel = f.layerName === L.layerName && f.text === L.text ? " selected" : "";
        return `<option value="${li}"${sel}>${esc(L.layerName)}「${esc(L.text.slice(0, 8))}」</option>`;
      }).join("") + `</select>` +
      `<label style="font-size:11px;display:flex;gap:3px;align-items:center"><input type="checkbox" data-k="variable" ${f.variable ? "checked" : ""} style="width:auto">可变</label>` +
      `<button class="danger" data-k="del" title="删除字段">✕</button>` +
      `<div class="layerinfo" data-k="info" style="grid-column:1/-1">${f.type === "fill"
        ? "已识别下划线空位：" + esc(f.prefix) + "【" + esc(f.blank) + "】" + esc(f.suffix) + (f.fontPS ? " · " + esc(f.fontPS) : "")
        : esc(f.fontPS || "")}</div>`;
    row.querySelector('[data-k="label"]').addEventListener("input", e => { f.label = e.target.value; });
    row.querySelector('[data-k="text"]').addEventListener("input", e => { f.text = e.target.value; });
    row.querySelector('[data-k="layer"]').addEventListener("change", e => {
      const li = Number(e.target.value);
      if (li < 0 || !matchLayers[li]) return;
      const L = matchLayers[li];
      f.text = L.text; f.label = f.label || "字段" + (i + 1);
      f.fontSize = L.fontSize || f.fontSize; f.color = L.color || f.color;
      if (L.bbox) {
        f.x = Math.round((L.bbox[0] + L.bbox[2]) / 2);
        f.y = Math.round((L.bbox[1] + L.bbox[3]) / 2);
        f.maxWidth = Math.round((L.bbox[2] - L.bbox[0]) * 1.4);
      }
      f.variable = true; f.fontPS = L.fontPS; f.layerName = L.layerName;
      f.autoShrink = true;
      buildMatchRows(cfg);
    });
    row.querySelector('[data-k="variable"]').addEventListener("change", e => { f.variable = e.target.checked; });
    row.querySelector('[data-k="del"]').addEventListener("click", () => {
      cfg.fields.splice(i, 1); buildMatchRows(cfg);
    });
    box.appendChild(row);
  });
}

async function saveMatch() {
  const file = $("matchFont").value;
  if (!file) { toast("请先选择或上传字体文件", true); return; }
  config.fonts = [{ family: Path_stem(file), file }];
  config.fields.forEach(f => { f.family = Path_stem(file); });
  const varIds = config.fields.filter(f => f.variable).map(f => f.id);
  if (varIds.length) config.batch = { delimiter: "/", fields: varIds };
  const resp = await apiFetch(`/api/templates/${tplId}/config`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(config)
  });
  if (!resp.ok) { toast("保存失败", true); return; }
  closeOverlay("matchOverlay");
  await selectTemplate(tplId);
  toast("✅ 匹配已保存，模板可用");
}
function Path_stem(fn) { return fn.replace(/\.(ttf|otf|woff2?|ttc)$/i, ""); }

async function uploadMatchFonts(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach(f => fd.append("files", f));
  const r = await fetch("/api/fonts", { method: "POST", body: fd });
  if (!r.ok) { toast("字体上传失败", true); return; }
  const data = await r.json();
  const fsel = $("matchFont");
  data.saved.forEach(fn => {
    if (![...fsel.options].some(o => o.value === fn)) {
      const opt = document.createElement("option");
      opt.value = fn; opt.textContent = fn;
      fsel.appendChild(opt);
    }
  });
  fsel.value = data.saved[data.saved.length - 1];
  toast("字体已上传：" + data.saved.join("、"));
}

/* ---------- 事件绑定 ---------- */
function bindEvents() {
  bindEditorInputs();
  bindMobileZoomAndTabs();
  $("backupTpl").addEventListener("click", backupTemplates);
  $("restoreTpl").addEventListener("click", () => $("restoreFile").click());
  $("restoreFile").addEventListener("change", e => restoreTemplates(e.target.files[0]));
  $("importListBtn").addEventListener("click", () => $("batchFile").click());
  $("batchFile").addEventListener("change", e => { if (e.target.files[0]) handleListFile(e.target.files[0]); e.target.value = ""; });
  $("importSheet").addEventListener("change", () => { const s = workbookSheets[Number($("importSheet").value)]; if (s) configureWorkbookRows(s.rows); });
  $("importConfirm").addEventListener("click", confirmWorkbookImport);

  $("tplSelect").addEventListener("change", e => { if (e.target.value) selectTemplate(e.target.value); });
  $("btnCopyTpl").addEventListener("click", async () => {
    const t = templates.find(x => x.id === tplId);
    const name = prompt("复制为新模板，名称：", (t ? t.name : "模板") + "-副本");
    if (name == null) return;
    const fd = new FormData();
    fd.append("name", name);
    try {
      const resp = await apiFetch(`/api/templates/${tplId}/duplicate`, { method: "POST", body: fd });
      if (!resp.ok) throw new Error("状态 " + resp.status);
      const data = await resp.json();
      await loadTemplates();
      await selectTemplate(data.id);
      toast("已复制为模板：" + data.name);
    } catch (e) { toast("复制失败：" + e.message, true); }
  });
  $("btnUpload").addEventListener("click", () => { $("upWarn").classList.add("hidden"); openOverlay("uploadOverlay"); });
  $("btnMatch").addEventListener("click", async () => {
    if (!(await askPagePassword("字段匹配"))) return;
    openMatchForCurrent();
  });
  $("btnDelTpl").addEventListener("click", async () => {
    if (!(await askPagePassword("删除模板"))) return;
    const t = templates.find(x => x.id === tplId);
    if (!confirm("删除模板「" + (t ? t.name : tplId) + "」？其版本也会清除")) return;
    await apiFetch(`/api/templates/${tplId}`, { method: "DELETE" });
    versions = []; persistVersions();
    tplId = null;
    await loadTemplates();
    if (templates.length) await selectTemplate(templates[0].id);
    else { config = null; bgImage = null; refImage = null; $("btnMatch").disabled = true; $("btnDelTpl").disabled = true; $("btnCopyTpl").disabled = true; renderEmptyCanvas(); openOverlay("uploadOverlay"); }
  });
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => {
    const id=b.dataset.close; closeOverlay(id); if(id==="saveImagesOverlay") clearSaveImages();
  }));
  document.querySelectorAll(".overlay").forEach(o => o.addEventListener("pointerdown", e => { if (e.target === o) { o.classList.add("hidden"); if(o.id==="saveImagesOverlay") clearSaveImages(); } }));

  $("upGo").addEventListener("click", doUpload);
  $("matchFontUp").addEventListener("change", e => uploadMatchFonts(e.target.files));
  $("matchAdd").addEventListener("click", () => {
    if (!config) return;
    config.fields.push({
      id: "f" + Date.now(), label: "新字段", text: "", variable: true,
      x: bgImage ? bgImage.naturalWidth / 2 : 400, y: bgImage ? bgImage.naturalHeight / 2 : 600,
      fontSize: 60, color: "#333333", align: "center", baseline: "middle",
      letterSpacing: 0, lineHeight: 1.5, autoShrink: true, maxWidth: null
    });
    buildMatchRows(config);
  });
  $("matchSave").addEventListener("click", saveMatch);

  $("saveVersion").addEventListener("click", () => { if (addVersion(fieldValues, "")) toast("已存为版本：" + displayName(fieldValues)); });
  $("keepAllUnderlines").addEventListener("change", e => { keepAllUnderlines = e.target.checked; render(); });
  $("resetForm").addEventListener("click", resetValuesToDefaults);
  $("exportCurrent").addEventListener("click", () => doExport([{ name: displayName(fieldValues), values: { ...fieldValues } }]));

  $("batchGen").addEventListener("click", batchParse);
  $("exportSelected").addEventListener("click", () => doExport(versions.filter(v => v.sel).map(v => ({ name: v.name, values: v.values }))));
  $("exportAll").addEventListener("click", () => doExport(versions.map(v => ({ name: v.name, values: v.values }))));
  $("clearVersions").addEventListener("click", () => {
    if (!versions.length) return;
    if (confirm("清空当前模板的全部 " + versions.length + " 个版本？")) { versions = []; persistVersions(); renderVersions(); }
  });

  $("exportWidth").addEventListener("change", () => {
    $("customWidth").classList.toggle("hidden", $("exportWidth").value !== "custom");
  });

  $("calibToggle").addEventListener("change", e => setCalib(e.target.checked));
  $("calibAlpha").addEventListener("input", () => { if (calibMode) render(); });
  $("saveConfig").addEventListener("click", saveConfigToServer);

  const canvas = $("main");
  canvas.addEventListener("pointerdown", e => {
    if (!calibMode || !config) return;
    const pt = toImageCoords(e);
    const ctx = canvas.getContext("2d");
    for (let i = config.fields.length - 1; i >= 0; i--) {
      const f = config.fields[i];
      const b = fieldBox(ctx, f, 1, fieldValues);
      const pad = 16;
      if (pt.x >= b.left - pad && pt.x <= b.left + b.w + pad && pt.y >= b.top - pad && pt.y <= b.top + b.h + pad) {
        selectedFieldId = f.id;
        dragState = { id: f.id, lastPt: pt, fx: f.x, fy: f.y };
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
        openFieldEditor(f);
        render();
        e.preventDefault();
        return;
      }
    }
    selectedFieldId = null; closeFieldEditor(); render();
  });
  canvas.addEventListener("pointermove", e => {
    if (!calibMode || !dragState) return;
    const pt = toImageCoords(e);
    const f0 = getField(dragState.id);
    if (!f0) return;
    const f = editTarget(f0);  // 点选字段拖的是当前选中的选项
    if (!f) return;
    dragState.fx += pt.x - dragState.lastPt.x;
    dragState.fy += pt.y - dragState.lastPt.y;
    dragState.lastPt = pt;
    f.x = Math.round(dragState.fx);
    f.y = Math.round(dragState.fy);
    syncEditorValues(f0);
    render();
  });
  window.addEventListener("pointerup", () => { dragState = null; });

  window.addEventListener("keydown", e => {
    if (!calibMode || !selectedFieldId) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    const f = getField(selectedFieldId); if (!f) return;
    const t = editTarget(f);
    const step = e.shiftKey ? 10 : 1;
    if (e.key === "ArrowLeft") t.x -= step;
    else if (e.key === "ArrowRight") t.x += step;
    else if (e.key === "ArrowUp") t.y -= step;
    else if (e.key === "ArrowDown") t.y += step;
    else return;
    e.preventDefault(); syncEditorValues(f); render();
  });
}
</script>
